# CI 用 broker 配置：关键是 brokerIP1 必须是 127.0.0.1
# 默认 broker 会用容器自身网卡 IP 注册到 namesrv，runner 宿主机上的测试进程连不上那个地址
brokerClusterName = DefaultCluster
brokerName = broker-a
brokerId = 0
deleteWhen = 04
fileReservedTime = 48
brokerRole = ASYNC_MASTER
flushDiskType = ASYNC_FLUSH
namesrvAddr = 127.0.0.1:9876
brokerIP1 = 127.0.0.1
autoCreateTopicEnable = true
autoCreateSubscriptionGroup = true
