# 集成测试专用 profile（@ActiveProfiles({"dev","integration"})，本文件覆盖 dev 的同名项）
#
# 库固定用 cabinet_test：可以被反复重建/drop，不会碰开发数据。
# 注意：这里不再往 spring.flyway.locations 里塞测试专用脚本目录 —— 测试夹具走 @Sql，
# 否则测试脚本会和正式迁移争抢版本号（踩过：V100 让新增的 V2 变成 out-of-order）。
spring:
  flyway:
    clean-disabled: false   # 仅测试库允许 clean，方便必要时重建；生产永远 true

cabinet:
  exception:
    echo-detail: true
  cors:
    # CORS 预发测试需要一个稳定的白名单项
    allowed-origin-patterns:
      - http://localhost:5173
  datasource:
    mysql:
      jdbc-url: "jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/cabinet_test?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&rewriteBatchedStatements=true"

logging:
  level:
    com.wherelee.cabinet: info
