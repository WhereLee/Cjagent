# 集成测试专用 profile（@ActiveProfiles({"dev","integration"})，本文件覆盖 dev 的同名项）
#
# 库固定用 cabinet_test：可以被反复重建/drop，不会碰开发数据。
# 注意：这里不再往 spring.flyway.locations 里塞测试专用脚本目录 —— 测试夹具走 @Sql，
# 否则测试脚本会和正式迁移争抢版本号（踩过：V100 让新增的 V2 变成 out-of-order）。
spring:
  flyway:
    clean-disabled: false   # 仅测试库允许 clean，方便必要时重建；生产永远 true

cabinet:
  scheduler:
    # 集成测试默认关掉后台调度线程。默认上下文会被 Spring 缓存整个 JVM，那个线程会在别的
    # 用例类运行期间继续扫库——worker 设计上就是不分租户、抢走任何到期任务的，于是随机出现
    # “某条用例什么都没发生”（任务被别人抢了租约）或“扫街没登记回扫”。
    # 本地快、CI 慢时更容易碰上。需要真实后台线程的用例类（SchedulerBackgroundPollTest /
    # ZsetTriggerTest / MqTriggerTest）在自己的 @SpringBootTest 里显式打开，
    # 并配 @DirtiesContext(AFTER_CLASS) 把线程随上下文一起关掉。
    poll-enabled: false
  exception:
    echo-detail: true
  pricing:
    # 集成测试沿用**旧的少量金额**，不是绕过用户定的价：真实价格（小400/中700/大1000、
    # 账户押金 5000）由 `PricingNumbersTest` 直接读 application.yml 钉住。
    # 这里调小是因为几十处与钱无关的用例（指令回扫、门磁、争议、调度）断言的是具体冻结额，
    # 跟着新价重算会把“改价格”这件事变成 60 处噪声，真正的回归信号反而被埋掉。
    # 要测账户押金本身的行为，请用这些小额（`AccountDepositFlowTest`），行为与金额无关。
    account-deposit-points: 200
    unit-points-per-hour:
      LARGE: 40
      MEDIUM: 25
      SMALL: 15
  cors:
    # CORS 预发测试需要一个稳定的白名单项
    allowed-origin-patterns:
      - http://localhost:5173
  datasource:
    mysql:
      jdbc-url: "jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/cabinet_test?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&rewriteBatchedStatements=true"

logging:
  level:
    com.wherelee.cabinet: info
