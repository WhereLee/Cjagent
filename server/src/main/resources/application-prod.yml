# 生产环境：信息收敛，一切外部地址/账号必须由环境变量注入，不给默认值
cabinet:
  exception:
    echo-detail: false
  mini:
    # 生产必须走真实 code2session；mock 实现另受 @Profile("!prod") 限制，不会装配
    mock-login: false
  pay:
    # 真实通道接入前（S-11），生产不装配任何通道：充值直接回“通道未配置”，
    # 而不是默认拿到一个 mock 通道默默给人加点数
    channel: none
  cors:
    # 正式域名必须显式列在这里；留空等于关闭跨域（宁可拒绝请求也不放开来源）
    allowed-origin-patterns: []
  datasource:
    mysql:
      jdbc-url: "jdbc:mysql://${MYSQL_HOST}:${MYSQL_PORT}/${MYSQL_DATABASE}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&rewriteBatchedStatements=true"
      maximum-pool-size: 30
      minimum-idle: 5
    pg:
      jdbc-url: "jdbc:postgresql://${PG_HOST}:${PG_PORT}/${PG_DATABASE}"

management:
  endpoints:
    web:
      exposure:
        # 生产只留健康与信息：metrics/prometheus/heapdump/env 根本不注册，
        # 不靠安全规则“拦”，而是让端点不存在
        include: health,info
  endpoint:
    health:
      show-details: never

springdoc:
  api-docs:
    # 生产不开接口清单
    enabled: false
  swagger-ui:
    enabled: false

logging:
  level:
    root: info
    com.wherelee.cabinet: info
