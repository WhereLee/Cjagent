server:
  port: 8080
  shutdown: graceful

spring:
  application:
    name: cabinet-server
  profiles:
    active: dev
  # 本地密钥来源：同目录 .env（已 gitignore）。用 properties 格式导入，
  # 这样 yml 里的 ${MYSQL_PASSWORD} 占位符能直接从 .env 取到值。
  config:
    import: "optional:file:.env[.properties]"
  lifecycle:
    timeout-per-shutdown-phase: 20s
  jackson:
    default-property-inclusion: non_null
    time-zone: GMT+8
  flyway:
    enabled: true
    locations: classpath:db/migration
    # 已有表但没有历史表的库（比如手动建过的库）允许接管，否则启动直接报错
    baseline-on-migrate: true
    baseline-version: 0
    table: flyway_schema_history
    # 生产环境永久禁止 clean（会清空整个库）
    clean-disabled: true
    validate-on-migrate: true
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      # 本机 Redis 是多项目共用实例，固定用独立库位 + key 前缀，避免互相踩数据
      database: ${REDIS_DATABASE:8}
      timeout: 3s
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 0

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      id-type: assign_id
      # 约定：需要逻辑删除的表统一加 deleted 字段（0 正常 / 1 已删）
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

rocketmq:
  name-server: ${ROCKETMQ_NAME_SERVER:127.0.0.1:9876}
  producer:
    group: cabinet-producer-group
    send-message-timeout: 3000
    retry-times-when-send-failed: 2

management:
  endpoints:
    web:
      exposure:
        # 默认只开健康与信息；metrics/prometheus 由 dev profile 追加，
        # prod 不暴露≠“不泄露”，而是那个端点根本不存在（比靠安全规则拦住更可靠）
        include: health,info
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true
  health:
    redis:
      enabled: true
    db:
      enabled: true
    diskspace:
      # 磁盘余量告警对本地开发没意义，CI/服务器上再开
      enabled: false

springdoc:
  # 不改 api-docs.path：改成 /openapi.json 会让分组文档变成 /openapi.json/1-admin 这种非标准路径，
  # 前端和接口工具默认都猜 /v3/api-docs，省事比“看起来干净”重要
  swagger-ui:
    path: /swagger-ui.html
    # 2.8 里 groups-order 是 Direction 枚举（asc/desc），不是旧版的 alpha
    groups-order: asc
    disable-swagger-default-url: true

cabinet:
  exception:
    # 生产环境绝不为 true：会把内部异常信息回显给前端
    echo-detail: false
  cors:
    # 白名单为空 = 关闭 CORS。各环境自己填，绝不用 * 配 allowCredentials
    allowed-origin-patterns: []
  access-log:
    enabled: true
    slow-threshold-ms: 500
  alloc:
    # 格口分配策略，第 9~10 刀靠它切策略跑对比，业务代码不变：
    #   pessimistic — SELECT … FOR UPDATE 锁候选行 + 锁内条件更新（默认，正确性最好证）
    #   cas         — 无锁读候选 + 按偏好逐个条件 UPDATE（能区分“没位/抢输”）
    #   redisson    — 分柜机分布式锁（锁必须活过事务提交，见 RedissonSlotAllocator）
    #   prealloc    — Redis 集合预扣 + MQ 异步落库（请求路径上无 DB 事务，代价是最终一致）
    strategy: pessimistic
    # prealloc 的占位租约：到期未被提交也未归还 = 悬空（少卖），由同步校准收敛
    hold-ttl: 180s
    # redisson 等锁上限：拿不到不排长队，直接回 10410 让客户端重试或换柜机
    lock-wait-ms: 800
  mq:
    # 订单“待落库”消息；tag 固定 order，同一 topic 后续可接超时释放、结算等语义分流
    order-persist-topic: storage-order-persist
    send-timeout-ms: 3000
  device:
    # 等设备回执的上限。这个值不是“越快越好”：它同时决定了“多快把异常告知用户”
    # 与“一次挂死的设备能拖住多少用户”。等待期间不开事务、不占连接
    receipt-timeout-ms: 2500
    # 连续失败到这个次数就标故障格口 + 停用柜机（阈值取低：坏柜机接客的用户损失比误停用大）
    fail-threshold: 3
    # 回扫重发同一条 requestId 的预算：设备端对同 requestId 幂等（只执行一次），
    # 所以重发不会多开门；但无限重发对物理动作是风险，用完就判死交人工
    rescan-max-retry: 2
  simulator:
    # 柜机模拟器（进程内，仅 dev/test/integration 装配）：它是可控故障源，不是设备仿真
    reply-delay-ms: 60
  pricing:
    # 轻档计费（S-02/S-03）：按尺寸小时价 + 每单固定押金；1 点 = 1 分，全链路整型不得用浮点
    # 下单时写进 pricing_snapshot，结算只能读快照：改价不得追溯影响已发的单
    deposit-points: 200
    free-minutes: 10
    unit-points-per-hour:
      LARGE: 40
      MEDIUM: 25
      SMALL: 15
    # 阶梯与封顶（第 13 刀）：每 24 个计费小时算一个计费日，单日最多收这么多个小时的价；
    # 超过 cap-days 天的部分不再计费。两个值都填 0 = 不限（旧快照的语义就是这个）。
    # 它们和单价一起进快照：改这两个数不得追溯影响进行中的单
    daily-cap-hours: 12
    cap-days: 3
    # 开门后的容错期（第 13B 刀）：这期间不计费，给用户挑包、放件、翻找。
    # 期满还没关门就从这一刻起计（所以“开门不关门”不是免费的）；关了就从关门起计。
    # 它取代了原来的 door-grace-minutes：“多久该提醒”与“多久该起计”是同一个时刻的两种说法，
    # 开两个近似参数总有一天会被配成不一样，那时计费起点没人说得清
    tolerance-minutes: 5
    # 远程结束/超窗重开的加收小时数（按该格口单价折算：小 30 / 中 50 / 大 80 点）。
    # 故意不单独建一张罚款价目表：那会和计时价漂移（改了小时价忘了改加收）
    remote-close-hours: 2
  sensor:
    # 柜内物检结论的可用时效（分钟）。设备“看了一眼”不等于“现在也是”：
    # 超龄结论一律当“没测过”，宁可标待确认也不能拿陈年读数把格子卖出去
    presence-max-age-minutes: 2
  dispute:
    # 每单 AI 看图复审次数上限。不设上限就是给用户一个“反复点否认刷模型调用”的按钮；
    # 用完直接转人工，而且**一次模型调用都不再发**（否则上限只是“多提醒几次”而不是止损）
    max-ai-review: 2
    # 复审实现：stub（桩，默认）| mimo（OpenAI 兼容识图）。默认桩是为了让 CI 与集成测试
    # **永不调用付费接口**（结论不可重现、会限流、还要管密钥）；接真模型只改这一项 + 环境变量
    review:
      client: stub
    mimo:
      # 密钥只从环境变量注入，不进仓库也不写明文配置：${MIMO_API_KEY:} 缺失时启动会直接失败
      # （配了 mimo 却没 key 是装配问题，不该等到用户按“否认”时才暴露）
      base-url: https://api.xiaomimimo.com/v1
      api-key: ${MIMO_API_KEY:}
      model: mimo-v2.6-flash
      timeout-ms: 20000
      # 思考 token 与正文共用这个预算：实测给 300 时正文会空（reasoning 把预算占满），
      # 所以给到 1200 起；正文为空仍会被当成 UNKNOWN，不会误判为“没东西”
      max-completion-tokens: 1200
      # 低于此置信度一律降为 UNKNOWN：模型会用肯定的语气说不确定的事
      min-confidence: 0.6
  pay:
    # 支付通道：mock | none。**这里默认 mock 是因为 dev 需要能充值**；
    # application-prod.yml 显式改成 none（不靠运行时的判断拦，而是让通道 bean 根本不存在，
    # 充值接口会明确返回“通道未配置”而不是默默加点数）
    channel: mock
    # 单笔充值上限（点数 = 分）：10 万点 = 1000 元。没上限就是刷金额的入口
    max-points-per-txn: 100000
  ratelimit:
    # 默认开。只允许本地压测时临时置 false（第 9 刀压测口径会标注），真实环境不得关闭
    enabled: true
  scheduler:
    # 触发方式：poll（纯 DB 轮询，默认）| zset（Redis 索引加速）| mq（RocketMQ 延迟消息）。
    # 三者都只起“提醒”作用，能不能执行由 biz_delay_task 上的租约条件更新决定（跳存储无事务）
    trigger: poll
    # 轮询开关（zset/mq 模式下也建议保留作为兜底）；集成测试关掉它，由用例自己调 runDue()
    poll-enabled: true
    poll-interval-ms: 15000
    initial-delay-ms: 20000
    zset-interval-ms: 1000
    batch-size: 20
    # 租约必须明显长于单任务耗时；否则任务还在跑就被别人接管，变成双执行
    lease-seconds: 60
    backoff-base-seconds: 30
    # 占位超时释放的宽限（“向上”的时间，宁晚不误）。门未关不再单独配宽限，见 pricing.tolerance-minutes
    hold-grace-minutes: 5
    overdue-remind-minutes: 60
    # 无回执指令多久后回扫（也是重试间隔）：太短会把一台抖动中的柜机反复摇，
    # 太长则用户已经走了才收敛
    command-rescan-seconds: 30
    # 指令扫街：盖“下发写了、收敛没跑、进程就被杀”这一类逐条提醒盖不到的现场
    sweep-interval-minutes: 5
    sweep-stale-minutes: 2
    sweep-batch-size: 50
    # 对账每轮最多接多少条悬挂押金（剩下下一轮再接，避免一轮写出万个任务）
    deposit-sweep-limit: 200
    # 逾期看管的硬兜底：盯到这里就停止续排并转人工（正常情况先被 cap-days 的封顶收口，
    # 这一条只兼顾“封顶配成不限”的租户）；停看管不等于丢现场，滞留数进对账指标
    stranded-days: 7
    sync-interval-minutes: 10
    reconcile-interval-minutes: 30
    # 对账分批大小：按账户 id 游标取一批再做聚合，单批代价与总行数无关。
    # 开大“少跑几次”在十万账户上是真事故（一条巨型 group by），不要调大
    reconcile-batch-size: 500
    # 差异日志里最多带几条样本（定位用，不是全量）
    reconcile-sample-size: 5
    bootstrap-interval-ms: 300000
    bootstrap-initial-delay-ms: 60000
    wake-topic: storage-task-wake
  tenant:
    # 全库统一的租户列名；白名单表自己读不到别人数据，但查它们时拦截器不会加条件，需手工过滤
    column: tenant_id
    ignore-tables: []
  jwt:
    # 无默认值：缺了或短于 32 字节直接启动失败，绝不带默认密钥上线
    secret: ${JWT_SECRET}
    issuer: cabinet-server
    access-ttl: 30m
    refresh-ttl: 7d
    permission-cache-ttl: 5m
  mini:
    # 本地没有 AppID 时可置 true 跑通链路；prod 配置文件里强制 false
    mock-login: false
    app-id: ${WECHAT_APP_ID:}
    app-secret: ${WECHAT_APP_SECRET:}
  datasource:
    mysql:
      jdbc-url: "jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:cabinet_dev}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&rewriteBatchedStatements=true"
      driver-class-name: com.mysql.cj.jdbc.Driver
      username: ${MYSQL_USERNAME}
      password: ${MYSQL_PASSWORD}
      pool-name: mysql-hikari
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 5000
    pg:
      jdbc-url: "jdbc:postgresql://${PG_HOST:127.0.0.1}:${PG_PORT:5432}/${PG_DATABASE:cabinet_agent}"
      driver-class-name: org.postgresql.Driver
      username: ${PG_USERNAME}
      password: ${PG_PASSWORD}
      pool-name: pg-hikari
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 5000
