# 开发环境：细节全开，方便联调定位
cabinet:
  exception:
    echo-detail: true
  mini:
    # 本地无小程序 AppID：把 code 直接当 openid 用，能把登录→带 token→调接口 全链路跑通并写进测试。
    # 开关同时受 @Profile("!prod") 限制，两层保险；详见 MockMiniAppClient 的安全边界说明。
    mock-login: true
  cors:
    # 前端工程 admin(8082) / mini(8083) 于 2026-10-19 重建。
    # vite proxy 会原样透传浏览器的 Origin，所以白名单必须包含这两个来源，
    # 否则所有带 Origin 的 POST（登录、下单等）都会得到 403 Invalid CORS request。
    allowed-origin-patterns:
      - http://localhost:8082
      - http://127.0.0.1:8082
      - http://localhost:8083
      - http://127.0.0.1:8083

management:
  endpoints:
    web:
      exposure:
        # dev 多开指标端点：本地排查靠 curl /actuator/metrics/... 就能看，不必装 Prometheus
        include: health,info,metrics,prometheus
  endpoint:
    health:
      # dev 直接看各项组件明细；prod 收敛，避免暴露内部结构
      show-details: always

logging:
  level:
    com.wherelee.cabinet: debug
    com.wherelee.cabinet.infrastructure.mapper: debug
