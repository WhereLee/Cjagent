# 开发环境：细节全开，方便联调定位
cabinet:
  exception:
    echo-detail: true
  mini:
    # 本地无小程序 AppID：把 code 直接当 openid 用，能把登录→带 token→调接口 全链路跑通并写进测试。
    # 开关同时受 @Profile("!prod") 限制，两层保险；详见 MockMiniAppClient 的安全边界说明。
    mock-login: true
  cors:
    # 后端占 8080；admin 跑 8082、mini 的 H5 跑 8083（8081 已被本机 RocketMQ 5 proxy 占用），
    # 5173 是 Vite 默认端口，留着以免有人改回默认后撞上同一个难归因的 CORS 报错
    allowed-origin-patterns:
      - http://localhost:5173
      - http://127.0.0.1:5173
      - http://localhost:8082
      - http://127.0.0.1:8082
      - http://localhost:8083
      - http://127.0.0.1:8083

management:
  endpoints:
    web:
      exposure:
        # dev 多开指标端点：本地排查靠 curl /actuator/metrics/... 就能看，不必装 Prometheus
        include: health,info,metrics,prometheus
  endpoint:
    health:
      # dev 直接看各项组件明细；prod 收敛，避免暴露内部结构
      show-details: always

logging:
  level:
    com.wherelee.cabinet: debug
    com.wherelee.cabinet.infrastructure.mapper: debug
